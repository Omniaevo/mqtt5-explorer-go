name: 'Build Wails app'

on:
  push:
    branches-ignore:
      - '**'
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch: # allows manual trigger from GitHub UI

env:
  # Prevents OOM errors during Node/Vue build
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    fail-fast: false # a failure on one platform won't cancel the others
    matrix:
      build:
        - name: 'MQTT5 Explorer (Linux)'
          platform: 'linux/amd64'
          os: 'ubuntu-latest'
        - name: 'MQTT5 Explorer (Windows)'
          platform: 'windows/amd64'
          os: 'windows-latest'
        - name: 'MQTT5 Explorer (MacOS)'
          platform: 'darwin/universal' # builds fat binary for arm64 + amd64
          os: 'macos-latest'

  runs-on: ${{ matrix.build.os }}

  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

    - name: Read version from wails.json
      id: version
      shell: bash
      run: |
        VERSION=$(jq -r '.info.productVersion' wails.json)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build
      uses: dAppServer/wails-build-action@v2.2
      with:
        build-name: ${{ matrix.build.name }}
        build-platform: ${{ matrix.build.platform }}
        go-version: '1.24'
        node-version: '24.x'
        wails-version: 'latest'
        package: true # uploads artifact; also publishes to release on tag
        # Injects the version from wails.json into the Go binary
        build-flags: "-ldflags \"-X main.version=${{ steps.version.outputs.version }}\""
