name: 'Build Wails app'

on:
  push:
    branches-ignore:
      - '**'
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch: # allows manual trigger from GitHub UI

env:
  # Prevents OOM errors during Node/Vue build
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one platform won't cancel the others
      matrix:
        build:
          - name: 'MQTT5 Explorer (Linux)'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'
          - name: 'MQTT5 Explorer (Windows)'
            platform: 'windows/amd64'
            os: 'windows-latest'
          - name: 'MQTT5 Explorer (MacOS)'
            platform: 'darwin/universal' # builds fat binary for arm64 + amd64
            os: 'macos-latest'

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        uses: dAppServer/wails-build-action@v3  # v3 uses upload-artifact@v4 internally
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          go-version: '1.24'
          node-version: '24.x'
          wails-version: 'v2.11.0'
          AUTO_STACK: false
          STACK: 'wails2'
          package: true # uploads artifact; also publishes to release on tag
