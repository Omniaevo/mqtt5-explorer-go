name: 'Build Wails app'

on:
  push:
    branches-ignore:
      - '**'
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

env:
  # Prevents OOM errors during Node/Vue build
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one platform won't cancel the others
      matrix:
        build:
          - name: mqtt5-explorer-go-${{ github.ref_name }}-linux-amd64
            platform: 'linux/amd64'
            os: 'ubuntu-latest'
          - name: mqtt5-explorer-go-${{ github.ref_name }}-linux-arm64
            platform: 'linux/arm64'
            os: 'ubuntu-24.04-arm' # arm64 version
          - name: mqtt5-explorer-go-${{ github.ref_name }}-windows-amd64.exe
            platform: 'windows/amd64'
            os: 'windows-latest'
          - name: mqtt5-explorer-go-${{ github.ref_name }}-windows-arm64.exe
            platform: 'windows/arm64'
            os: 'windows-11-arm' # arm64 version
          - name: mqtt5-explorer-go-${{ github.ref_name }}-darwin-universal
            platform: 'darwin/universal' # arm64 + amd64
            os: 'macos-latest'

    runs-on: ${{ matrix.build.os }}

    steps:
      # Checkout the project
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Setup development environment
      - name: Setup GoLang environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      # Install Wails and platform dependencies
      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
        shell: bash
      - name: Install MacOS Wails dependencies
        if: runner.os == 'macOS'
        run: brew install mitchellh/gon/gon
        shell: bash
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
        shell: bash

      # Build Step
      - name: Build app for MacOS and Windows
        if: runner.os != 'Linux'
        working-directory: '.'
        run: |
          wails build -platform ${{ matrix.build.platform }} -webview2 embed -o ${{ matrix.build.name }}
        shell: bash
      - name: Build app for Linux
        if: runner.os == 'Linux'
        working-directory: '.'
        run: |
          wails build -platform ${{ matrix.build.platform }} -webview2 embed -o ${{ matrix.build.name }} -tags webkit2_41
        shell: bash

      # Executable permissions
      - name: Post-build actions for Linux
        if: runner.os == 'Linux'
        run: chmod a+x build/bin/*
        shell: bash
      - name: Post-build actions for MacOS
        if: runner.os == 'macOS'
        working-directory: '.'
        run: chmod +x build/bin/*/Contents/MacOS/*
        shell: bash

      # Building zip archive for MacOS
      - name: Build .app zip file
        if: runner.os == 'macOS'
        working-directory: '.'
        shell: bash
        run: |
          ditto -c -k --keepParent ./build/bin/${{ matrix.build.name }}.app ./build/bin/${{ matrix.build.name }}.app.zip

      # Upload build assets
      - name: Upload
        uses: actions/upload-artifact@v7
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISHING_TOKEN }}
        with:
          name: MQTT5 Explorer (Go) for ${{ runner.os }}
          path: |
            */bin/
            *\bin\*
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          token: ${{ secrets.PUBLISHING_TOKEN }}
          files: |
            */bin/*
