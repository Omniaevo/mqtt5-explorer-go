name: 'Build Wails app'

on:
  push:
    branches-ignore:
      - '**'
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch: # allows manual trigger from GitHub UI

env:
  # Prevents OOM errors during Node/Vue build
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one platform won't cancel the others
      matrix:
        build:
          - name: 'Linux'
            artifact: 'mqtt5-explorer-go-linux-amd64'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'
          - name: 'Windows'
            artifact: 'mqtt5-explorer-go-windows-amd64.exe'
            platform: 'windows/amd64'
            os: 'windows-latest'
          - name: 'MacOS'
            artifact: 'mqtt5-explorer-go'
            platform: 'darwin/universal' # builds fat binary for arm64 + amd64
            os: 'macos-latest'

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        uses: The-Egg-Corp/wails-build-action@v2.1
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISHING_TOKEN }}
        with:
          build-name: ${{ matrix.build.artifact }}
          build-platform: ${{ matrix.build.platform }}
          go-version: '1.24'
          node-version: '24.x'
          wails-version: 'v2.11.0'
          nsis: false # Set to true to create an installer.
          package: true # uploads artifact; also publishes to release on tag
